[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcribe-relay"
version = "0.1.0"
description = "Client and server for file transcription with Buzz"
requires-python = ">=3.9"
dependencies = ["tomli>=1.1; python_version < '3.11'"]

[project.optional-dependencies]
server = ["fastapi>=0.128; python_version >= '3.12'", "uvicorn; python_version >= '3.12'"]
dev = ["ruff"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["transcribe_relay*"]
namespaces = false

[tool.ruff]
target-version = "py39"

[tool.ruff.per-file-target-version]
"src/transcribe_relay/{server,config,storage,buzz,worker}.py" = "py312"
"tests/test_{server,config,storage,worker}.py" = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
